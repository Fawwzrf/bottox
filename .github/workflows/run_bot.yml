name: Auto Trading Tournament 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *' # Mengecek setiap 30 menit, namun tertahan oleh antrean concurrency jika bot masih jalan

# PENGUNCI ANTREAN: Mencegah 2 sesi berjalan bersamaan!
concurrency:
  group: quant-bot-solana-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-quant-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Ambil Kode & Checkpoint Terakhir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Identitas Git untuk Live Sync
        run: |
          git config --global user.name "QuantBot AutoSave"
          git config --global user.email "bot@users.noreply.github.com"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Library
        run: pip install requests urllib3

      - name: Jalankan Bot Turnamen (5 Jam Nonstop + Live Sync)
        run: python3 -u tournament_6_godmode.py

      - name: Push Checkpoint Akhir Sesi ke Repository
        if: always()
        run: |
          git add hasil_6varian_48jam.txt state_6varian.json
          git commit -m "Final session checkpoint save" || echo "Sudah tersimpan"
          git pull --rebase -X theirs origin main || true
          git push origin main
